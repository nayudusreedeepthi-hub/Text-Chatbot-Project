<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text Analysis Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">

            <div>
                <h1>🤖 Text Analysis Chatbot</h1>
                <p>NLP-Based Conversational Assistant</p>
            </div>

            <span class="online">
                ● Online
            </span>

        </header>


        <main class="chat-container">

            <div id="chatBox" class="chat-box">

                <div class="message bot-message">

                    <div class="avatar">
                        🤖
                    </div>

                    <div class="bubble">

                        <strong>ChatBot</strong>

                        <p>
                            Hello! 👋 I am your Text Analysis
                            Chatbot. Ask me something!
                        </p>

                    </div>

                </div>

            </div>


            <div class="typing" id="typing">
                ChatBot is typing...
            </div>


            <div class="input-area">

                <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">

                <button id="sendBtn">
                    ➤
                </button>

            </div>

        </main>


        <footer>

            <span>
                Text & Speech Analysis
            </span>

            <span>
                NLP Chatbot
            </span>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
